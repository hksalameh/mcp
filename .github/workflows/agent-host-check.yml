name: Haitham Agent host check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2
    steps:
      - name: Read-only host check
        shell: bash
        run: |
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          echo "UPTIME=$(uptime -p)"
          free -h | sed -n '1,2p'
          df -h / | tail -1
